name: VHOST Fuzzer

on:
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install ffuf
        run: |
          wget -q https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_linux_amd64.tar.gz
          tar -xzf ffuf_2.1.0_linux_amd64.tar.gz
          sudo mv ffuf /usr/local/bin/
          ffuf -V

      - name: Verify files exist
        run: |
          [ -f ips.txt ]       || { echo "ips.txt not found!";       exit 1; }
          [ -f subs_bare.txt ] || { echo "subs_bare.txt not found!"; exit 1; }
          [ -s ips.txt ]       || { echo "ips.txt is empty!";        exit 1; }
          [ -s subs_bare.txt ] || { echo "subs_bare.txt is empty!";  exit 1; }
          echo "ips.txt       -> $(wc -l < ips.txt) IPs"
          echo "subs_bare.txt -> $(wc -l < subs_bare.txt) subdomains"

      - name: Verify subs_bare.txt has no protocols
        run: |
          BAD=$(grep -cE '^https?://' subs_bare.txt || true)
          if [ "$BAD" -gt 0 ]; then
            echo "subs_bare.txt contains $BAD lines with http:// or https://"
            exit 1
          fi
          echo "subs_bare.txt is clean"

      - name: Run VHOST Fuzz on all IPs
        run: |
          mkdir -p results
          SKIPPED=0
          FUZZED_IPS=0
          FUZZED_RUNS=0

          > results/ip_map.txt

          while IFS= read -r raw_ip; do

            [[ -z "$raw_ip" || "$raw_ip" == \#* ]] && continue

            safe_ip=$(echo "$raw_ip" | tr './' '__' | tr -dc 'A-Za-z0-9_-')
            ip="$raw_ip"

            echo "${safe_ip}=${ip}" >> results/ip_map.txt

            echo ""
            echo "========================================"
            echo "[*] Fuzzing: $ip"
            echo "========================================"

            FUZZED_IPS=$((FUZZED_IPS + 1))

            # ── HTTP ──────────────────────────────────────
            read B1_BODY B1_CODE < <(curl -sk -o /dev/null \
              -w "%{size_download} %{http_code}" \
              -H "Host: totalgarbagexyz123abc.com" \
              --connect-timeout 3 --max-time 5 \
              "http://$ip" 2>/dev/null)
            B1_CODE="${B1_CODE:-000}"

            read B2_BODY _ < <(curl -sk -o /dev/null \
              -w "%{size_download} %{http_code}" \
              -H "Host: totalgarbagexyz123abc.com" \
              --connect-timeout 3 --max-time 5 \
              "http://$ip" 2>/dev/null)

            read B3_BODY _ < <(curl -sk -o /dev/null \
              -w "%{size_download} %{http_code}" \
              -H "Host: totalgarbagexyz123abc.com" \
              --connect-timeout 3 --max-time 5 \
              "http://$ip" 2>/dev/null)

            BASELINE_HTTP=$(echo -e "$B1_BODY\n$B2_BODY\n$B3_BODY" | \
              grep -v '^\s*$' | sort | uniq -c | sort -rn | awk 'NR==1{print $2}')

            if [ -z "$BASELINE_HTTP" ] || [ "$B1_CODE" = "000" ]; then
              echo "    [!] HTTP unreachable on $ip - skipping HTTP"
              SKIPPED=$((SKIPPED + 1))
            else
              echo "    [+] HTTP baseline size = $BASELINE_HTTP | status = $B1_CODE"

              if [ "$BASELINE_HTTP" = "0" ]; then
                echo "    [!] Baseline size is 0 - switching to status-code filter"
                ffuf \
                  -w subs_bare.txt \
                  -u "http://$ip" \
                  -H "Host: FUZZ" \
                  -mc all \
                  -fc "000,${B1_CODE},404,400,500,502,503" \
                  -t 40 -timeout 5 -rate 80 -maxtime 120 \
                  -o "results/http_${safe_ip}.json" \
                  -of json -s 2>/dev/null \
                  && echo "    [+] HTTP fuzz done" \
                  || echo "    [!] ffuf HTTP failed on $ip - continuing"
              else
                ffuf \
                  -w subs_bare.txt \
                  -u "http://$ip" \
                  -H "Host: FUZZ" \
                  -mc all \
                  -fc "000,404,400,500,502,503" \
                  -fs "$BASELINE_HTTP" \
                  -t 40 -timeout 5 -rate 80 -maxtime 120 \
                  -o "results/http_${safe_ip}.json" \
                  -of json -s 2>/dev/null \
                  && echo "    [+] HTTP fuzz done" \
                  || echo "    [!] ffuf HTTP failed on $ip - continuing"
              fi
              FUZZED_RUNS=$((FUZZED_RUNS + 1))
            fi

            # ── HTTPS ─────────────────────────────────────
            read B1_BODY B1_CODE < <(curl -sk -o /dev/null \
              -w "%{size_download} %{http_code}" \
              -H "Host: totalgarbagexyz123abc.com" \
              --connect-timeout 3 --max-time 5 \
              "https://$ip" 2>/dev/null)
            B1_CODE="${B1_CODE:-000}"

            read B2_BODY _ < <(curl -sk -o /dev/null \
              -w "%{size_download} %{http_code}" \
              -H "Host: totalgarbagexyz123abc.com" \
              --connect-timeout 3 --max-time 5 \
              "https://$ip" 2>/dev/null)

            read B3_BODY _ < <(curl -sk -o /dev/null \
              -w "%{size_download} %{http_code}" \
              -H "Host: totalgarbagexyz123abc.com" \
              --connect-timeout 3 --max-time 5 \
              "https://$ip" 2>/dev/null)

            BASELINE_HTTPS=$(echo -e "$B1_BODY\n$B2_BODY\n$B3_BODY" | \
              grep -v '^\s*$' | sort | uniq -c | sort -rn | awk 'NR==1{print $2}')

            if [ -z "$BASELINE_HTTPS" ] || [ "$B1_CODE" = "000" ]; then
              echo "    [!] HTTPS unreachable on $ip - skipping HTTPS"
              SKIPPED=$((SKIPPED + 1))
            else
              echo "    [+] HTTPS baseline size = $BASELINE_HTTPS | status = $B1_CODE"

              if [ "$BASELINE_HTTPS" = "0" ]; then
                echo "    [!] Baseline size is 0 - switching to status-code filter"
                ffuf \
                  -w subs_bare.txt \
                  -u "https://$ip" \
                  -H "Host: FUZZ" \
                  -k -mc all \
                  -fc "000,${B1_CODE},404,400,500,502,503" \
                  -t 40 -timeout 5 -rate 80 -maxtime 120 \
                  -o "results/https_${safe_ip}.json" \
                  -of json -s 2>/dev/null \
                  && echo "    [+] HTTPS fuzz done" \
                  || echo "    [!] ffuf HTTPS failed on $ip - continuing"
              else
                ffuf \
                  -w subs_bare.txt \
                  -u "https://$ip" \
                  -H "Host: FUZZ" \
                  -k -mc all \
                  -fc "000,404,400,500,502,503" \
                  -fs "$BASELINE_HTTPS" \
                  -t 40 -timeout 5 -rate 80 -maxtime 120 \
                  -o "results/https_${safe_ip}.json" \
                  -of json -s 2>/dev/null \
                  && echo "    [+] HTTPS fuzz done" \
                  || echo "    [!] ffuf HTTPS failed on $ip - continuing"
              fi
              FUZZED_RUNS=$((FUZZED_RUNS + 1))
            fi

          done < ips.txt

          echo ""
          echo "========================================"
          echo "[+] Fuzzing complete"
          echo "    IPs processed : $FUZZED_IPS"
          echo "    Protocol runs : $FUZZED_RUNS"
          echo "    Skipped       : $SKIPPED"
          echo "========================================"

      - name: Write parser script
        run: |
          cat > /tmp/parse_results.py << 'ENDOFSCRIPT'
          import json, sys, os, glob

          ip_map = {}
          with open("results/ip_map.txt") as f:
              for line in f:
                  line = line.strip()
                  if "=" not in line:
                      continue
                  safe, real = line.split("=", 1)
                  if safe and real:
                      ip_map[safe] = real

          rows = []
          for filepath in glob.glob("results/*.json"):
              filename = os.path.basename(filepath).replace(".json", "")
              if filename.startswith("https_"):
                  proto = "https"
                  sanitized_ip = filename[6:]
              elif filename.startswith("http_"):
                  proto = "http"
                  sanitized_ip = filename[5:]
              else:
                  continue

              real_ip = ip_map.get(sanitized_ip, sanitized_ip)

              try:
                  with open(filepath) as fh:
                      data = json.load(fh)
              except Exception as e:
                  print(f"Could not parse {filepath}: {e}", file=sys.stderr)
                  continue

              for r in data.get("results", []):
                  host   = r.get("input", {}).get("FUZZ", "?")
                  status = r.get("status", "?")
                  length = r.get("length", "?")
                  words  = r.get("words", "?")
                  rows.append(f"{proto},{real_ip},{host},{status},{length},{words}")

          with open("results/hits.csv", "w") as out:
              out.write("Protocol,IP,Host,Status,Length,Words\n")
              for row in rows:
                  out.write(row + "\n")

          print(f"Total hits: {len(rows)}")
          ENDOFSCRIPT

      - name: Parse all results into summary
        run: |
          [ -s results/ip_map.txt ] || { echo "ip_map.txt empty - no IPs were processed"; exit 1; }

          shopt -s nullglob
          json_files=(results/*.json)
          if [ ${#json_files[@]} -eq 0 ]; then
            echo "No result JSON files found - all IPs unreachable or no hits"
            echo "No hits found" > results/hits.csv
            exit 0
          fi

          python3 /tmp/parse_results.py

          echo ""
          echo "=== HITS FOUND ==="
          cat results/hits.csv

      - name: Upload full results folder
        uses: actions/upload-artifact@v4
        with:
          name: vhost-all-results
          path: results/
          retention-days: 7
